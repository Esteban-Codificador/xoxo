name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A push and its pull request share one group, so only the latest run survives.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ai_roadmap
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: ai_roadmap_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_roadmap -d ai_roadmap_testing"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, redis, intl
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Build assets (Wayfinder types and Vite manifest)
        run: npm run build

      - name: Lint PHP (Pint)
        run: composer lint:check

      - name: Lint and format JS (oxlint, oxfmt)
        run: npm run check

      - name: Types PHP (PHPStan)
        run: composer types:check

      - name: Types TS (tsc)
        run: npm run types:check

      - name: Generated TypeScript enums are up to date
        run: php artisan types:enums --check

      - name: Migrations run, seed and roll back
        env:
          DB_DATABASE: ai_roadmap_testing
          MAIL_MAILER: log
        run: |
          php artisan migrate:fresh --seed --force
          php artisan migrate:rollback --force
          php artisan migrate --force

      - name: Backend tests (Pest on PostgreSQL)
        run: php artisan test

      - name: Frontend tests (Vitest)
        run: npm run test
