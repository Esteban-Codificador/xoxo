# Local infrastructure only: the Laravel app runs on the host (ADR-017).
#   docker compose up -d
services:
    pgsql:
        # PostgreSQL 16 with pgvector available for the V2 AI features.
        image: pgvector/pgvector:pg16
        environment:
            POSTGRES_DB: ai_roadmap
            POSTGRES_USER: ai_roadmap
            POSTGRES_PASSWORD: secret
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        volumes:
            - pgsql-data:/var/lib/postgresql/data
            - ./docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql:ro
        healthcheck:
            test: ['CMD', 'pg_isready', '-U', 'ai_roadmap', '-d', 'ai_roadmap']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

    mailpit:
        # Captures outgoing mail (verification, password reset): http://localhost:8025
        image: axllent/mailpit:latest
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'

volumes:
    pgsql-data:
    redis-data:
